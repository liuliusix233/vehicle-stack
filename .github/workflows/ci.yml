name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: python syntax
        run: python -m compileall -q software || exit 1
      - name: secret scan (fails on HIGH)
        run: python tools/sanitize.py --root . --out /dev/null --fail-on HIGH --quiet
      - name: shell syntax
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f" || exit 1; done
      - name: docs present
        run: test -f docs/HOW-WE-BUILT-IT.md && test -f AGENTS.md && test -f docs/TROUBLESHOOTING.md