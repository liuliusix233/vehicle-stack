<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=480, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HUD v5</title>
<style>
  @font-face {
    font-family: 'Odibee Sans';
    src: url('OdibeeSans-Regular.ttf') format('truetype');
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#000}
  body{display:flex;align-items:center;justify-content:center}

  .hud{
    width:100vw;height:100vh;background:#000;color:#fff;
    font-family:'Odibee Sans','Courier New',monospace;
    display:grid;
    grid-template-columns:[c1] 1fr [c2] 1fr [c3] 1fr [c4] 1fr;
    grid-template-rows:[r1] 1fr [r2] 2.2fr [r3] 1.3fr;
    padding:0 2vw;
  }

  /* ===== Compass — Continuous Scale Bar ===== */
  .compass-box{
    grid-column:1/5;grid-row:1;
    position:relative;overflow:hidden;
    padding:0 10vw;
  }
  .compass-strip{
    position:absolute;bottom:0;left:0;
    height:100%;
    will-change:transform;
    transform:translate3d(0,0,0);
  }
  /* Ticks */
  .ct{position:absolute;bottom:18%;width:1px}
  /* Degree labels */
  .ct-deg{
    position:absolute;bottom:4%;
    font-size:2vw;color:#556688;
    transform:translateX(-50%);
    white-space:nowrap;
    font-family:inherit;
  }
  /* Direction labels (北东北东西南西北) */
  .ct-lbl{
    position:absolute;bottom:28%;
    font-size:3vw;color:#99bbdd;
    transform:translateX(-50%);
    white-space:nowrap;
    font-family:inherit;
    font-weight:bold;
  }
  /* Fixed center indicator */
  .compass-indicator{
    position:absolute;bottom:0;left:50%;
    transform:translateX(-50%);
    z-index:3;
    width:0;height:0;
    border-left:1.4vw solid transparent;
    border-right:1.4vw solid transparent;
    border-bottom:2.2vw solid #FF5722;
    filter:drop-shadow(0 0 0.8vw #FF572255);
  }

  /* ===== Speed (left) ===== */
  .speed-box{
    grid-column:1/3;grid-row:2;
    display:flex;align-items:center;justify-content:center;
    gap:0.3vw;
  }
  .speed-num{
    font-size:22vw;line-height:1;color:#fff;
    min-width:28vw;text-align:center;
  }
  .speed-right{
    display:flex;flex-direction:column;
    align-items:center;gap:0.3vh;
  }
  .speed-unit{font-size:3.5vw;color:#445566;line-height:1}
  .gear-box{
    width:8vw;height:8vw;
    background:#fff;border-radius:0.6vw;
    display:flex;justify-content:center;align-items:center;
    font-size:5vw;line-height:1;color:#000;
  }

  /* ===== RPM (right side) ===== */
  .rpm-box{
    grid-column:3/5;grid-row:2;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:1vh;
    padding:0 2vw;
    position:relative;
  }
  .rpm-bot{display:flex;align-items:center;justify-content:space-between;width:100%}
  .conn-st{display:flex;gap:1vw;align-items:center}
  .wifi-svg{display:flex;align-items:center}
  .wifi-svg svg{width:2.2vw;height:2.2vw;display:block;fill:#445566;transition:fill 0.4s ease}
  .wifi-svg.on svg{fill:#fff}
  .pi-tag{
    border:0.13vw solid #3399ff;color:#3399ff;
    border-radius:0.35vw;padding:0.05vw 0.5vw;
    font-size:1.6vw;line-height:1.4;height:2.2vw;
    display:flex;align-items:center;
    transition:all 0.4s ease;font-family:'Odibee Sans',monospace;
  }
  .pi-tag.off{border-color:#445566;color:#445566}
  .nano-tag{
    border:0.13vw solid #4CAF50;color:#4CAF50;
    border-radius:0.35vw;padding:0.05vw 0.5vw;
    font-size:1.6vw;line-height:1.4;height:2.2vw;
    display:flex;align-items:center;
    transition:all 0.4s ease;font-family:'Odibee Sans',monospace;
  }
  .nano-tag.off{border-color:#445566;color:#445566}
  .rpm-label{
    font-size:3vw;color:#445566;
    align-self:flex-start;letter-spacing:0.3vw;
  }
  .rpm-bar-bg{
    width:100%;height:3.5vh;
    background:#0a1a2a;border-radius:0.6vh;
    overflow:hidden;
  }
  .rpm-bar-fill{
    height:100%;border-radius:0.6vh;
    background:linear-gradient(to right,#3399ff,#66bbff,#fff);
    transition:width 0.12s ease;
  }
  .rpm-number{
    font-size:6vw;color:#66bbff;line-height:1;
    align-self:flex-end;
  }
  .rpm-unit{font-size:3vw;color:#445566}

  /* ===== Bottom Row ===== */
  .bottom-row{
    grid-column:1/5;grid-row:3;
    display:grid;
    grid-template-columns:1fr 2fr 1.2fr 0.8fr;
    align-items:center;
    gap:0.5vw;
    padding:0.5vh 0;
  }

  /* Left: Odometer */
  .b-left{
    display:flex;flex-direction:column;
    align-items:center;line-height:1.1;
  }
  .b-left .odo{font-size:5vw;color:#fff;}
  .b-left .odo-l{font-size:2.5vw;color:#445566}

  /* Center: Vertical stacked bars */
  .b-center{
    display:flex;flex-direction:column;
    gap:1.5vh;height:100%;justify-content:center;
  }
  .b-item{
    display:flex;align-items:center;
    gap:0.8vw;height:6vh;
  }
  .b-item .lbl{font-size:2.5vw;color:#445566;width:3.5vw;flex-shrink:0}
  .bar-bg{
    flex:1;height:100%;
    background:#0a1a2a;border-radius:0.4vh;overflow:hidden;
  }
  .bar-fill{height:100%;border-radius:0.4vh;transition:width 0.2s}
  .bar-fill.bl{background:#3399ff}
  .bar-fill.og{background:#FF5722}
  .bar-fill.gr{background:#4CAF50}
  .b-item .val{font-size:2.8vw;color:#fff;width:6vw;text-align:right;flex-shrink:0}

  /* Middle right: 2x2 grid (V EH / L/100 SRV) */
  .b-mid{
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;gap:0.2vw;
    padding:0 0.3vw;
  }
  .b-mid .m-row{font-size:2.5vw;color:#8899aa;text-align:center;line-height:1.2}
  .b-mid .m-val{color:#fff}
  .b-mid .m-lbl{color:#445566;font-size:1.8vw}

  /* Right: Clock */
  .b-right .t{font-size:5vw;color:#fff;line-height:1;letter-spacing:0.2vw}
  .b-right{text-align:center}

  /* Bottom row no-data fallback */
  .dim{color:#445566}

  /* ===== Voice Overlay — Wave Animation ===== */
  .voice-overlay{
    position:fixed;bottom:0;right:0;
    z-index:100;
    display:flex;align-items:flex-end;
    gap:0.3vw;
    padding:0.5vw 0.8vw;
    opacity:0;visibility:hidden;
    transition:opacity 0.3s ease,visibility 0.3s ease;
    pointer-events:none;
  }
  .voice-overlay.active{
    opacity:1;visibility:visible;
  }
  .voice-overlay .v-bar{
    width:0.6vw;border-radius:0.2vw 0.2vw 0 0;
    background:linear-gradient(to top,#3399ff,#66bbff);
    transition:height 0.08s ease;
    min-height:0.3vw;
    box-shadow:0 0 0.3vw rgba(51,153,255,0.5);
  }
  .voice-overlay .v-text{
    font-size:2vw;color:#66bbff;
    font-family:'Odibee Sans',monospace;
    margin-left:0.5vw;
    white-space:nowrap;
    letter-spacing:0.1vw;
    text-shadow:0 0 0.5vw rgba(51,153,255,0.4);
  }

  /* Speaking: different color set */
  .voice-overlay.speaking .v-bar{
    background:linear-gradient(to top,#4CAF50,#81C784);
    box-shadow:0 0 0.3vw rgba(76,175,80,0.5);
  }
  .voice-overlay.speaking .v-text{
    color:#81C784;
  }

  /* Processing: pulsing glow */
  .voice-overlay.processing .v-bar{
    animation:pulse-bar 0.5s ease infinite alternate;
    background:linear-gradient(to top,#FF9800,#FFB74D);
    box-shadow:0 0 0.5vw rgba(255,152,0,0.6);
  }
  .voice-overlay.processing .v-text{
    color:#FFB74D;
  }

  @keyframes pulse-bar{
    0%{height:0.3vw;opacity:0.4}
    100%{height:1.2vw;opacity:1}
  }

  /* Voice mic icon (idle) */
  .voice-mic{
    position:fixed;bottom:0.5vw;right:0.5vw;
    z-index:99;
    width:2.5vw;height:2.5vw;
    opacity:0.2;
    transition:opacity 0.3s;
    pointer-events:none;
  }
  .voice-mic.listening{
    opacity:0.6;
    animation:mic-pulse 1.5s ease infinite;
  }
  @keyframes mic-pulse{
    0%,100%{opacity:0.3}
    50%{opacity:0.7}
  }
</style>
</head>
<body>
<div class="hud">

  <!-- Row 1: Compass -->
  <div class="compass-box">
    <div class="compass-strip" id="compStrip"></div>
    <div class="compass-indicator"></div>
  </div>

  <!-- Row 2 left: Speed + Gear -->
  <div class="speed-box">
    <span class="speed-num" id="speedNum">--</span>
    <div class="speed-right">
      <span class="speed-unit">KM/H</span>
      <div class="gear-box" id="gearBox">N</div>
    </div>
  </div>

  <!-- Row 2 right: RPM horizontal -->
  <div class="rpm-box">
    <div class="rpm-label">RPM</div>
    <div class="rpm-bar-bg">
      <div class="rpm-bar-fill" id="rpmFill" style="width:0%"></div>
    </div>
    <div class="rpm-bot">
      <div class="conn-st">
        <div class="wifi-svg on" id="wifiIcon">
          <svg viewBox="0 0 24 24">
            <path d="M12 21c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm4-6.5c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2s.9 2 2 2h4c1.1 0 2-.9 2-2zm3.5-5.5c0-1.1-.9-2-2-2h-11c-1.1 0-2 .9-2 2s.9 2 2 2h11c1.1 0 2-.9 2-2z"/>
          </svg>
        </div>
        <div class="pi-tag off" id="piTag">PI</div>
        <div class="nano-tag off" id="nanoTag">NANO</div>
      </div>
      <span class="rpm-number" id="rpmNum">-- <span class="rpm-unit">RPM</span></span>
    </div>
  </div>

  <!-- Row 3 -->
  <div class="bottom-row">
    <div class="b-left">
      <span class="odo" id="odoNum">--</span>
      <span class="odo-l">KM</span>
    </div>

    <div class="b-center">
      <div class="b-item">
        <span class="lbl">FUEL</span>
        <div class="bar-bg"><div class="bar-fill og" id="fuelBar" style="width:0%"></div></div>
        <span class="val" id="fuelVal">--</span>
      </div>
      <div class="b-item">
        <span class="lbl">BAT</span>
        <div class="bar-bg"><div class="bar-fill bl" id="powerBar" style="width:0%"></div></div>
        <span class="val" id="voltVal">--</span>
      </div>
    </div>

    <div class="b-mid">
      <div class="m-row"><span class="m-lbl">V</span> <span class="m-val" id="voltNum">--</span></div>
      <div class="m-row"><span class="m-lbl">EH</span> <span class="m-val" id="engHrsVal">--</span></div>
      <div class="m-row"><span class="m-lbl">L/100</span> <span class="m-val" id="consNum">--</span></div>
      <div class="m-row"><span class="m-lbl">SRV</span> <span class="m-val" id="srvKmVal">--</span></div>
    </div>

    <div class="b-right">
      <span class="t" id="clockT">--:--</span>
    </div>
  </div>

</div>

<!-- Voice overlay: wave animation -->
<div class="voice-mic" id="voiceMic">
  <svg viewBox="0 0 24 24" fill="#66bbff">
    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
  </svg>
</div>

<div class="voice-overlay" id="voiceOverlay">
  <div class="v-bar" style="height:0.3vw"></div>
  <div class="v-bar" style="height:0.6vw"></div>
  <div class="v-bar" style="height:1.0vw"></div>
  <div class="v-bar" style="height:1.4vw"></div>
  <div class="v-bar" style="height:1.8vw"></div>
  <div class="v-bar" style="height:1.4vw"></div>
  <div class="v-bar" style="height:1.0vw"></div>
  <div class="v-bar" style="height:0.6vw"></div>
  <div class="v-bar" style="height:0.3vw"></div>
  <span class="v-text" id="voiceText">嘿Vox?</span>
</div>

<script>
const st={speed:-1,rpm:-1,voltage:-1,power:-1,fuelCons:-1,fuelLevel:-1,odo:-1,heading:-1,gear:0,engHrs:-1,srvKm:-1,voiceState:'idle',voiceText:'',nanoOn:false};

// ── Continuous compass — scales and direction labels ──
const DEG_PX=6;           // pixels per degree on strip
const EXTRA=360;           // extra degrees past 0/360 to fill scroll buffer
const STRIP_DEG=360+EXTRA*2; // 1080° total on strip
const STRIP_PX=STRIP_DEG*DEG_PX;

let displayHdg=-1;        // frame-interpolated
let targetHdg=-1;          // latest sensor value
const HDG_LERP=0.08;       // per-frame lerp (60fps → ~5°/frame)

const D={
  sn:document.getElementById('speedNum'),
  rf:document.getElementById('rpmFill'),
  rn:document.getElementById('rpmNum'),
  gb:document.getElementById('gearBox'),
  pb:document.getElementById('powerBar'),
  fb:document.getElementById('fuelBar'),
  vv:document.getElementById('voltVal'),
  fv:document.getElementById('fuelVal'),
  vn:document.getElementById('voltNum'),
  cn:document.getElementById('consNum'),
  on:document.getElementById('odoNum'),
  eh:document.getElementById('engHrsVal'),
  sk:document.getElementById('srvKmVal'),
  ct:document.getElementById('clockT'),
  cs:document.getElementById('compStrip'),
  wi:document.getElementById('wifiIcon'),
  pt:document.getElementById('piTag'),
  nn:document.getElementById('nanoTag'),
  av:document.getElementById('altVal'),
  sv:document.getElementById('slopeVal'),
  si:document.getElementById('slopeIcon'),
  sb:document.getElementById('slopeBox'),
};

// ── Build continuous scale strip (ticks + degree + Chinese direction labels) ──
const CARD_CN={0:'北',45:'东北',90:'东',135:'东南',180:'南',225:'西南',270:'西',315:'西北'};

function buildCompassStrip(){
  const items=[];
  const start=-EXTRA,end=360+EXTRA;
  for(let d=start;d<=end;d+=5){
    const norm=((d%360)+360)%360;
    const x=(d-start)/STRIP_DEG*100;
    const is90=d%90===0,is45=d%45===0&&!is90;
    const is30=d%30===0&&!is45&&!is90;
    const is10=d%10===0&&!is30&&!is45&&!is90;
    const is5=d%5===0&&!is10&&!is30&&!is45&&!is90;
    // Tick height: flatter scale
    const h=is90?'40%':is45?'32%':is30?'25%':is10?'16%':'10%';
    const c=is90?'rgba(150,190,230,0.55)':is45?'rgba(100,150,200,0.45)':
            is30?'rgba(70,110,160,0.35)':
            is10?'rgba(40,70,110,0.25)':'rgba(20,40,70,0.18)';
    items.push('<div class="ct" style="left:'+x+'%;height:'+h+';background:'+c+'"></div>');
    // Chinese direction labels at 45° intervals
    if(is90||is45){
      items.push('<div class="ct-lbl" style="left:'+x+'%">'+CARD_CN[norm]+'</div>');
    }
    // Degree numbers at 30° intervals
    if(is30||is90||is45){
      items.push('<div class="ct-deg" style="left:'+x+'%">'+norm+'°</div>');
    }
  }
  D.cs.innerHTML=items.join('');
  D.cs.style.width=STRIP_PX+'px';
}
buildCompassStrip();

function lerpAngle(from,to,t){
  let d=to-from;
  while(d>180)d-=360;
  while(d<-180)d+=360;
  return from+d*t;
}

// ── Render compass: slide strip so current heading aligns under indicator ──
function drawCompass(hdg){
  if(hdg<0)return;
  const box=D.cs.parentElement;
  const boxW=box.clientWidth;
  const centerPx=boxW/2;
  // heading's position on the strip (px from strip left edge)
  const hdgPx=(hdg+EXTRA)/STRIP_DEG*STRIP_PX;
  // translate so heading aligns under center of visible box
  const tx=centerPx-hdgPx;
  D.cs.style.transform='translate3d('+tx+'px,0,0)';
}

function draw(){
  const s=st;
  D.sn.textContent=s.speed>=0?String(Math.round(s.speed)):'--';
  D.gb.textContent=s.speed>=0&&s.rpm>=0?(function(){
    if(s.speed<1||s.rpm<100)return'N';
    // XT5 9T50 final 3.47 tire 235/65R18: speed-per-1000RPM by gear
    const ra=s.speed/(s.rpm/1000),tt=[0,12.5,13.8,16.9,21.6,28.7,41.4,55.5,67.2,999];
    for(let g=1;g<=9;g++)if(ra<tt[g])return String(g);
    return'9';
  })():'N';

  // RPM horizontal bar
  const rp=s.rpm>=0?Math.min(s.rpm/7000*100,100):0;
  D.rf.style.width=rp+'%';
  D.rn.innerHTML=s.rpm>=0?String(s.rpm)+' <span class="rpm-unit">RPM</span>':'-- <span class="rpm-unit">RPM</span>';

  // Bars
  const pp=s.power>=0?Math.min(100,s.power):0;
  D.pb.style.width=pp+'%';
  D.vv.textContent=s.power>=0?Math.round(s.power)+'%':'--';
  const fp=s.fuelLevel>=0?Math.min(100,s.fuelLevel):0;
  D.fb.style.width=fp+'%';
  D.fb.className='bar-fill '+(fp<15?'bl':'og');
  D.fv.textContent=s.fuelLevel>=0?Math.round(s.fuelLevel)+'%':'--';

  // Voltage
  D.vn.textContent=s.voltage>=0?s.voltage.toFixed(1)+'V':'--';
  // Fuel consumption
  D.cn.textContent=s.fuelCons>=0?s.fuelCons.toFixed(1):'--';

  // Odometer
  D.on.textContent=s.odo>=0?s.odo.toFixed(1):'--';

  // Engine hours since service
  if(s.engHrs>=0){
    D.eh.textContent=s.engHrs>=100?Math.round(s.engHrs)+'h':s.engHrs.toFixed(1)+'h';
  }else{D.eh.textContent='--'}

  // Service km
  if(s.srvKm>=0){
    D.sk.textContent=Math.round(s.srvKm).toLocaleString()+'km';
  }else{D.sk.textContent='--'}

  // Connection status icons
  D.wi.className='wifi-svg'+(s.wifiOn?' on':'');
  D.pt.className='pi-tag'+(s.piOn?'':' off');
  D.nn.className='nano-tag'+(s.nanoOn?'':' off');

  // Altitude
  D.av.textContent=s.altitude>=0?Math.round(s.altitude):'--';

  // Slope
  if(s.slope>=0){
    const absSlp=Math.abs(s.slope);
    const sVal=absSlp<0.3?'0':absSlp<10?absSlp.toFixed(1):Math.round(absSlp);
    D.sv.textContent=sVal;
    if(absSlp<0.5){
      D.sv.className='slope-val flat';
      D.si.textContent='→';
    }else if(s.slope>0){
      D.sv.className='slope-val climb';
      D.si.textContent='↗';
    }else{
      D.sv.className='slope-val descent';
      D.si.textContent='↘';
    }
  }else{
    D.sv.textContent='--';
    D.sv.className='slope-val';
    D.si.textContent='→';
  }
  
  // Voice overlay
  const vs=s.voiceState||'idle';
  const vt=s.voiceText||'';
  const vo=document.getElementById('voiceOverlay');
  const vm=document.getElementById('voiceMic');
  const vtEl=document.getElementById('voiceText');
  const bars=vo.querySelectorAll('.v-bar');
  
  if(vs==='idle'){
    vo.classList.remove('active','speaking','processing');
    vm.classList.remove('listening');
  }else{
    vo.classList.add('active');
    vo.classList.remove('speaking','processing');
    vm.classList.add('listening');
    
    if(vs==='waking'||vs==='listening'){
      // Wave animation active (listening)
    }else if(vs==='processing'){
      vo.classList.add('processing');
    }else if(vs==='speaking'){
      vo.classList.add('speaking');
    }
    
    // Update text
    const labels={waking:'嘿Vox?',listening:'聆听中...',processing:'思考中...',speaking:vt||'播报中...'};
    vtEl.textContent=labels[vs]||vs;
  }

  // Compass — no guard, always draw interpolated heading
  if(s.heading!==targetHdg)targetHdg=s.heading;
  if(targetHdg>=0||displayHdg>=0){
    if(displayHdg<0)displayHdg=targetHdg;
    else if(targetHdg>=0)displayHdg=lerpAngle(displayHdg,targetHdg,HDG_LERP);
    // Snap tiny diffs (<0.5°) to avoid jitter
    if(targetHdg>=0&&Math.abs(displayHdg-targetHdg)<0.5)displayHdg=targetHdg;
    drawCompass(displayHdg);
  }
}

function updateData(d){
  if(d.speed!==undefined&&d.speed>=0)st.speed=d.speed;
  if(d.rpm!==undefined&&d.rpm>=0)st.rpm=d.rpm;
  if(d.voltage!==undefined&&d.voltage>=0)st.voltage=d.voltage;
  if(d.power!==undefined&&d.power>=0)st.power=d.power;
  if(d.fuelCons!==undefined&&d.fuelCons>=0)st.fuelCons=d.fuelCons;
  if(d.fuelLevel!==undefined&&d.fuelLevel>=0)st.fuelLevel=d.fuelLevel;
  if(d.odo!==undefined&&d.odo>=0)st.odo=d.odo;
  if(d.heading!==undefined&&d.heading>=0)st.heading=d.heading;
  if(d.engHrs!==undefined&&d.engHrs>=0)st.engHrs=d.engHrs;
  if(d.srvKm!==undefined&&d.srvKm>=0)st.srvKm=d.srvKm;
  if(d.wifiOn!==undefined)st.wifiOn=d.wifiOn;
  if(d.piOn!==undefined)st.piOn=d.piOn;
  if(d.nanoOn!==undefined)st.nanoOn=d.nanoOn;
  if(d.altitude!==undefined)st.altitude=d.altitude;
  if(d.slope!==undefined)st.slope=d.slope;
}

setInterval(()=>{
  const n=new Date();
  document.getElementById('clockT').textContent=
    String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
},10000);

// ── Voice wave animation (sine wave with natural jitter) ──
const waveBars=document.querySelectorAll('#voiceOverlay .v-bar');
const WAVE_TOTAL_BARS=waveBars.length;
const WAVE_CENTER=Math.floor(WAVE_TOTAL_BARS/2);
const WAVE_MAX_H=2.2;  // vw
const WAVE_MIN_H=0.3;

function animateWave(){
  const vo=document.getElementById('voiceOverlay');
  if(!vo.classList.contains('active')||vo.classList.contains('processing')||vo.classList.contains('speaking')){
    // For processing/speaking, use different animation
    if(vo.classList.contains('processing')){
      // Pulsing glow handled by CSS
    }else if(vo.classList.contains('speaking')){
      // Speaking: gentle breathing oscillation
      const t=Date.now()/600;
      waveBars.forEach((bar,i)=>{
        const h=WAVE_MIN_H+Math.sin(t+i*0.8)*0.15+0.15;
        bar.style.height=h+'vw';
      });
    }
    requestAnimationFrame(animateWave);
    return;
  }
  
  // Active listening wave
  const t=Date.now()/300;
  const jitter=Math.sin(Date.now()/500)*0.15;
  waveBars.forEach((bar,i)=>{
    const dist=Math.abs(i-WAVE_CENTER)/WAVE_CENTER;
    const base=WAVE_MIN_H+(WAVE_MAX_H-WAVE_MIN_H)*(1-dist*0.6);
    const h=Math.max(WAVE_MIN_H,base+Math.sin(t-i*0.7)*0.35+jitter*(1-dist));
    bar.style.height=Math.min(WAVE_MAX_H,h)+'vw';
  });
  
  requestAnimationFrame(animateWave);
}

function loop(){draw();requestAnimationFrame(loop)}
loop();
animateWave();
</script>
